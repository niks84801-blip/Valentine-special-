<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine ❤️</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#ff4e8a,#ff9ecb);
color:white;
text-align:center;
overflow-x:hidden;
}

.container{
padding:20px;
}

h1{
margin-top:10px;
}

.slideshow{
max-width:320px;
margin:auto;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.slideshow img{
width:100%;
border-radius:15px;
}

.message{
background:rgba(255,255,255,0.2);
padding:20px;
border-radius:15px;
margin-top:20px;
min-height:180px;
line-height:1.6;
font-size:16px;
}

button{
padding:12px 22px;
font-size:16px;
border:none;
border-radius:25px;
background:white;
color:#ff4e8a;
font-weight:bold;
margin-top:20px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

/* floating hearts */
.heart{
position:fixed;
bottom:-10px;
animation:floatUp 5s linear infinite;
}

@keyframes floatUp{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-100vh);
opacity:0;
}
}
</style>

</head>

<body>

<div class="container">

<h1>❤️ Happy Valentine's Day ❤️</h1>

<!-- Slideshow -->
<div class="slideshow">
<img id="slide" src="photo1.jpg">
</div>

<!-- Message -->
<div class="message" id="typing"></div>

<!-- Play Button -->
<button onclick="showPlayer()">🎵 Play Our Song 💕</button>

<!-- Spotify Player -->
<div id="spotifyPlayer" style="display:none;max-width:320px;margin:auto;margin-top:15px;">
<iframe style="border-radius:12px"
src="https://open.spotify.com/embed/track/5bHDGWyIFML1LYXZWTD5MF"
width="100%"
height="80"
frameborder="0"
allow="autoplay; clipboard-write; encrypted-media;">
</iframe>
</div>

</div>

<script>

/* Slideshow */
let images = [
"photo1.jpg",
"photo2.jpg",
"photo3.jpg",
"photo4.jpg",
"photo5.jpg"
];

let slideIndex = 0;

setInterval(function(){

slideIndex++;

if(slideIndex >= images.length){
slideIndex = 0;
}

document.getElementById("slide").src = images[slideIndex];

}, 2000);


/* Full Typing Message */
let text = `baby mujhe pta h ki tm bs mere ho but fir bhi puchhna to bnta h na ...
will u be my valentine forever.. hmesa ke liye...
or hum kbhi bhi tmko kisi or se replace nhi krna chahte..... I love youuuuuuuu 🌹🫂♥️🧿.....
pta h hmara bht jhagda hota h lekin kuchh bhi ho jye last me aana to tmhare pss hee h naa
pta nhi kaise itna chipak gye ho mere dil se.....
I love you sweetheart 💋😘😘`;

let index = 0;

function typeEffect(){

if(index < text.length){

document.getElementById("typing").innerHTML += text.charAt(index);

index++;

setTimeout(typeEffect, 40);

}

}

typeEffect();


/* Show Spotify Player */
function showPlayer(){

document.getElementById("spotifyPlayer").style.display = "block";

}


/* Floating Hearts */
function createHeart(){

let heart = document.createElement("div");

heart.className = "heart";

heart.innerHTML = "❤️";

heart.style.left = Math.random() * 100 + "vw";

heart.style.fontSize = (Math.random() * 20 + 15) + "px";

document.body.appendChild(heart);

setTimeout(function(){

heart.remove();

}, 5000);

}

setInterval(createHeart, 500);

</script>

</body>
</html>
